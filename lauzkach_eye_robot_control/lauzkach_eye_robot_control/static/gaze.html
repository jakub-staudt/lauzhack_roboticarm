<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaze pick and place</title>
<link rel="stylesheet" href="gaze.css">
</head>
<body>
<div id="stage">
  <img id="cam" alt="Overhead camera" draggable="false">
  <canvas id="overlay"></canvas>

  <div id="top">
    <div id="msg"><b id="msg-title">Look at a block</b><span id="msg-detail">Look at it for 2 seconds to pick it.</span></div>
    <div id="chips">
      <span id="chip-tracker" class="chip">Eye tracker…</span>
      <span id="chip-arm" class="chip">Arm…</span>
      <button id="btn-full" class="small" title="Full screen (F)">⛶</button>
    </div>
  </div>
  <div id="progress"><div id="progress-fill"></div><span id="progress-text"></span></div>

  <div id="buttons">
    <button class="gbtn" id="b-select" data-key="select"><span>Select</span><small>move the chosen block to the chosen spot</small></button>
    <button class="gbtn" id="b-restart" data-key="restart"><span>Restart selection</span><small>forget the block and the spot</small></button>
    <button class="gbtn stop" id="b-stop" data-key="stop"><span>Cancel</span><small>stop the arm</small></button>
    <button class="gbtn calib" id="b-calib" data-key="calibrate"><span>Calibrate eyes</span><small id="calib-hint">look at the dots</small></button>
  </div>

  <div id="confirm" hidden>
    <div class="card"><b id="confirm-text">Move the block?</b>
      <div class="row"><button class="gbtn go" data-key="yes"><span>Yes, move it</span></button><button class="gbtn" data-key="no"><span>No</span></button></div>
    </div>
  </div>
  <div id="calib-layer" hidden><div id="calib-dot"></div><div id="calib-text"></div></div>
</div>
<script src="gaze.js"></script>
</body>
</html>
