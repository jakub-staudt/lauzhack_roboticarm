<text x="164" y="842" class="mono" >GET /api/state · POST /api/…</text>
<rect x="436" y="823" width="216" height="28" rx="7" fill="#a9a2f5" fill-opacity=".07" stroke="#a9a2f5" stroke-opacity=".22"/>
<text x="448" y="842" class="mono" >/cameras/{name}.mjpg</text>
<rect x="664" y="823" width="98" height="28" rx="7" fill="#a9a2f5" fill-opacity=".07" stroke="#a9a2f5" stroke-opacity=".22"/>
<text x="676" y="842" class="mono" >:8765</text>
</g>
<path d="M605 514v-21" stroke="#80cdeb" stroke-width="1.5" marker-end="url(#arrowBlue)"/><path d="M635 493v21" stroke="#b9f28b" stroke-width="1.5" marker-end="url(#arrowMint)"/>
<text x="658" y="508" class="sub">commands / cached telemetry</text>
<g transform="translate(0 -44)">
<rect x="124" y="568" width="1032" height="130" rx="16" fill="url(#card)" stroke="#30434d"/>
<rect x="124" y="591" width="4" height="84" rx="2" fill="#b9f28b"/>
<circle cx="72" cy="604" r="21" fill="#142128" stroke="#b9f28b" stroke-opacity=".55"/>
<text x="61" y="609" class="mono" fill="#b9f28b">03</text>
<text x="152" y="609" class="heading" >Control service</text>
<text x="1128" y="607" class="label" fill="#b9f28b" text-anchor="end">RUNTIME</text>
<text x="152" y="644" class="body" >20 Hz loop · joint limits · control ownership · heartbeat · STOP / hold</text>
<rect x="152" y="657" width="294" height="28" rx="7" fill="#b9f28b" fill-opacity=".07" stroke="#b9f28b" stroke-opacity=".22"/>
<text x="164" y="676" class="mono" >panel.py · PanelController</text>
<rect x="458" y="657" width="193" height="28" rx="7" fill="#b9f28b" fill-opacity=".07" stroke="#b9f28b" stroke-opacity=".22"/>
<text x="470" y="676" class="mono" >soarm-panel process</text>
</g>
