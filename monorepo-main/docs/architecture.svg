<text x="658" y="674" class="sub">targets / measured state</text>
<g transform="translate(0 288)">
<rect x="124" y="402" width="1032" height="130" rx="16" fill="url(#card)" stroke="#30434d"/>
<rect x="124" y="425" width="4" height="84" rx="2" fill="#80cdeb"/>
<circle cx="72" cy="438" r="21" fill="#142128" stroke="#80cdeb" stroke-opacity=".55"/>
<text x="61" y="443" class="mono" fill="#80cdeb">02</text>
<text x="152" y="443" class="heading" >Drivers layer</text>
<text x="1128" y="441" class="label" fill="#80cdeb" text-anchor="end">DEVICE I/O</text>
<text x="152" y="478" class="body" >USB → serial → Feetech bus · servo commands and measured positions</text>
<rect x="152" y="491" width="146" height="28" rx="7" fill="#80cdeb" fill-opacity=".07" stroke="#80cdeb" stroke-opacity=".22"/>
<text x="164" y="510" class="mono" >soarm/feetech.py</text>
<rect x="310" y="491" width="108" height="28" rx="7" fill="#80cdeb" fill-opacity=".07" stroke="#80cdeb" stroke-opacity=".22"/>
<text x="322" y="510" class="mono" >pyserial</text>
<rect x="430" y="491" width="302" height="28" rx="7" fill="#80cdeb" fill-opacity=".07" stroke="#80cdeb" stroke-opacity=".22"/>
<text x="442" y="510" class="mono" >panel_cameras.py · OpenCV</text>
</g>
<path d="M605 846v-21" stroke="#80cdeb" stroke-width="1.5" marker-end="url(#arrowBlue)"/><path d="M635 825v21" stroke="#b9f28b" stroke-width="1.5" marker-end="url(#arrowMint)"/>
<text x="658" y="840" class="sub">serial packets / USB camera frames</text>
<g transform="translate(0 664)">
<rect x="124" y="192" width="1032" height="174" rx="16" fill="url(#card)" stroke="#30434d"/>
<rect x="124" y="215" width="4" height="128" rx="2" fill="#d9b38c"/>
<circle cx="72" cy="228" r="21" fill="#142128" stroke="#d9b38c" stroke-opacity=".55"/>
<text x="61" y="233" class="mono" fill="#d9b38c">01</text>
<text x="152" y="233" class="heading" >Hardware / physics</text>
<text x="1128" y="231" class="label" fill="#d9b38c" text-anchor="end">PHYSICAL WORLD</text>
<path d="M635 254v87" stroke="#30434d"/>
<text x="152" y="279" class="label" fill="#d9b38c">MECHANICAL</text>
<text x="152" y="309" class="body" >SO-101 · links, joints and gripper</text>
<text x="152" y="337" class="sub" >Motion, geometry and mechanical limits</text>
<text x="660" y="279" class="label" fill="#d9b38c">ELECTRICAL</text>
<text x="660" y="309" class="body" >STS3215 servos · power · USB serial adapter</text>
<text x="660" y="337" class="sub" >Overhead + wrist cameras on USB</text>
</g>
<path d="M48 1062h1184" stroke="#30434d"/>
<path d="M64 1103v-24" stroke="#80cdeb" stroke-width="2" marker-end="url(#arrowBlue)"/>
<text x="90" y="1096" class="sub" >Feedback ↑ UI</text>
<path d="M261 1079v24" stroke="#b9f28b" stroke-width="2" marker-end="url(#arrowMint)"/>
<text x="292" y="1096" class="sub" >Commands ↓ hardware</text>
<text x="1230" y="1096" class="label" fill="#8fa5af" text-anchor="end">LOGICAL LAYERS · NOT SEPARATE MICROSERVICES</text>
<text x="48" y="1135" class="sub" >Service + API share the soarm-panel process. The custom dashboard adds an HTTP proxy; cameras feed the API alongside servo telemetry.</text>
</svg>
