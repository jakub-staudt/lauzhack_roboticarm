[project]
name = "arm-dashboard"
version = "0.1.0"
description = "Browser-facing proxy for the Ramion arm controller: workbench UI, cameras, viewer, board scan."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    # Upstream side of the /viewer/ relay; uvicorn[standard] also uses it for the browser side.
    "websockets>=17.4",
]

[project.optional-dependencies]
# The board-scan collector runs as a subprocess and is the only code that imports these.
scan = ["numpy==2.5.3", "opencv-contrib-python==5.0.0.93"]

[project.scripts]
arm-dashboard = "arm_dashboard.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout", "ruff>=0.6", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
pythonpath = ["tests"]
# Every proxy test talks to sockets; a hung stream must fail, not stall the run.
timeout = 30

[tool.ruff]
line-length = 110
target-version = "py312"
# The legacy stdlib implementation and its tests, kept as written until it is retired.
extend-exclude = ["legacy"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["arm_dashboard", "fakes", "harness", "legacy", "targets"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
