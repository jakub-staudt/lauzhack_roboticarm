# Builds the Kotlin Multiplatform desktop app (kmp_app/) for macOS (.dmg, Apple Silicon and Intel) and Windows (.msi).
# Each installer must be built on its own OS. Runs on demand, on pushes that touch kmp_app/, and on tags
# like kmp-v1.0.0, which also publish both installers as a GitHub release.
name: KMP desktop

on:
  workflow_dispatch:
  push:
    paths: ["kmp_app/**", ".github/workflows/kmp-desktop.yml"]
    tags: ["kmp-v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon
            task: packageMacDmg      # ad-hoc signed with the camera entitlement (see build.gradle.kts)
            files: kmp_app/composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: macos-15-intel      # Intel
            task: packageMacDmg
            files: kmp_app/composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            files: kmp_app/composeApp/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kmp_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        run: ./gradlew --no-daemon :composeApp:${{ matrix.task }}
        shell: bash
      - name: Name the file after the platform
        if: runner.os == 'macOS'
        run: for f in composeApp/build/compose/binaries/main/dmg/*.dmg; do mv "$f" "${f%.dmg}-$(uname -m).dmg"; done
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: GazeStation-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/kmp-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
